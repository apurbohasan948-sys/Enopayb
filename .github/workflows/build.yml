name: Build Android APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Prepare Keystores & Environment (.env)
        run: |
          # 1. Prepare .env for Secrets Gradle Plugin
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=" > .env
          fi
          
          # Ensure .env.example also exists
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=" > .env.example
          fi

          # 2. Decode Debug Keystore if present as base64
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # 3. Handle custom Release Keystore if configured in GitHub Secrets
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding custom release keystore..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          cache-read-only: false

      - name: Build Debug & Release APKs
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p outputs/debug outputs/release outputs/all
          
          # Find and copy Debug APKs
          find app/build/outputs/apk/debug -name "*.apk" -type f -exec cp -v {} outputs/debug/JARVIS-debug.apk \; 2>/dev/null || true
          
          # Find and copy Release APKs
          find app/build/outputs/apk/release -name "*.apk" -type f -exec cp -v {} outputs/release/JARVIS-release.apk \; 2>/dev/null || true
          
          # Copy all discovered APKs to outputs/all
          find app/build/outputs/apk -name "*.apk" -type f -exec cp -v {} outputs/all/ \; 2>/dev/null || true
          
          echo "=== Built APK Files ==="
          ls -la outputs/all/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: outputs/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Release-APK
          path: outputs/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload All Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-All-APKs
          path: outputs/all/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: outputs/all/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

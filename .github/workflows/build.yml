name: Build Android APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Configure Secrets & Environment (.env)
        run: |
          # Configure .env file for Secrets Gradle Plugin
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=" > .env
          fi
          echo "Configured .env file successfully."

      - name: Configure Release Keystore & Signing
        id: signing_setup
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "has_release_signing=true" >> $GITHUB_OUTPUT
          else
            echo "No custom release keystore provided. Defaulting to debug signing fallback for release build."
            echo "has_release_signing=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          cache-read-only: false

      - name: Initialize Gradle Wrapper & Build APKs
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x ./gradlew || true
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p outputs/debug outputs/release
          
          # Find and copy Debug APK
          find app/build/outputs/apk/debug -name "*.apk" -type f -exec cp -v {} outputs/debug/JARVIS-debug.apk \;
          
          # Find and copy Release APK
          find app/build/outputs/apk/release -name "*.apk" -type f -exec cp -v {} outputs/release/JARVIS-release.apk \;
          
          # Flatten into main outputs folder for easy bundle access
          mkdir -p outputs/all
          find outputs/debug outputs/release -name "*.apk" -type f -exec cp -v {} outputs/all/ \;
          
          echo "=== Collected APKs ==="
          ls -lh outputs/all/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: outputs/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Release-APK
          path: outputs/release/*.apk
          retention-days: 30

      - name: Upload All Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-All-APKs
          path: outputs/all/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: outputs/all/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

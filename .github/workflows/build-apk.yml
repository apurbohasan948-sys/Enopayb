name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apks:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & SDK Components
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=" > .env
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Generate Wrapper & Build APKs
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x ./gradlew || true
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Collect Generated APKs
        run: |
          mkdir -p apk-output
          find app/build/outputs/apk -type f -name "*.apk" -exec cp -v {} apk-output/ \;
          ls -la apk-output/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APKs
          path: apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
